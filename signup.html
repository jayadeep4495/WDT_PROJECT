<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MOVIEBLAST – Create Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
  :root {
    --red: #e50914;
    --red-dark: #b20710;
    --gold: #f5c518;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1f1f1f;
    --text: #ffffff;
    --muted: #8c8c8c;
    --border: rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  /* Animated background */
  .bg-cinematic {
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(229,9,20,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(229,9,20,0.08) 0%, transparent 50%),
      var(--bg);
  }
  .bg-cinematic::before {
    content:'';position:absolute;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  /* Navbar */
  .top-bar {
    position:relative;z-index:10;
    padding:20px 48px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .logo {
    font-family:'Bebas Neue',sans-serif;
    font-size:2.2rem; letter-spacing:3px;
    color:var(--red);
    text-decoration:none;
    text-shadow:0 0 30px rgba(229,9,20,0.5);
  }
  .logo span { color:var(--text); }
  /* Main container */
  .signup-wrap {
    position:relative;z-index:5;
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .signup-card {
    background:rgba(20,20,20,0.92);
    border:1px solid var(--border);
    border-radius:16px;
    padding:48px 52px;
    width:100%;max-width:480px;
    backdrop-filter:blur(20px);
    box-shadow:0 32px 80px rgba(0,0,0,0.6);
    animation:slideUp .6s ease both;
  }
  @keyframes slideUp {
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
  }
  .signup-card h1 {
    font-size:2rem;font-weight:700;
    margin-bottom:8px;
  }
  .signup-card .subtitle {
    color:var(--muted);font-size:.95rem;
    margin-bottom:32px;
  }
  /* Form styling */
  .form-group { margin-bottom:20px; position:relative; }
  .form-label {
    font-size:.8rem;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);margin-bottom:8px;
    display:block;
  }
  .form-control-sv {
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    padding:14px 18px;
    font-family:'Outfit',sans-serif;
    font-size:.95rem;
    transition:border-color .25s, box-shadow .25s;
    outline:none;
  }
  .form-control-sv:focus {
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(229,9,20,0.15);
  }
  .form-control-sv.is-invalid { border-color:#ff4757; }
  .form-control-sv.is-valid { border-color:#2ed573; }
  .input-icon { position:relative; }
  .input-icon i {
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    color:var(--muted);cursor:pointer;transition:color .2s;
  }
  .input-icon i:hover{color:var(--text);}
  .error-msg {
    font-size:.78rem;color:#ff4757;
    margin-top:5px;display:none;
  }
  .error-msg.show{display:block;}
  /* Password strength */
  .strength-bar {
    height:3px;border-radius:2px;
    background:var(--surface2);
    margin-top:8px;overflow:hidden;
  }
  .strength-fill {
    height:100%;border-radius:2px;
    width:0;transition:width .4s,background .4s;
  }
  .strength-label {
    font-size:.75rem;color:var(--muted);
    margin-top:4px;
  }
  /* Plan selector */
  .plan-grid {
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:10px;margin-bottom:4px;
  }
  .plan-card {
    background:var(--surface2);
    border:2px solid var(--border);
    border-radius:10px;padding:12px 8px;
    text-align:center;cursor:pointer;
    transition:all .25s;
  }
  .plan-card:hover{border-color:rgba(229,9,20,0.4);}
  .plan-card.selected{border-color:var(--red);background:rgba(229,9,20,0.08);}
  .plan-card .plan-name{font-size:.85rem;font-weight:600;}
  .plan-card .plan-price{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .plan-card .plan-badge{
    font-size:.65rem;background:var(--red);color:#fff;
    border-radius:4px;padding:1px 6px;display:inline-block;margin-top:4px;
  }
  /* Divider */
  .or-divider {
    display:flex;align-items:center;gap:12px;
    margin:24px 0;color:var(--muted);font-size:.85rem;
  }
  .or-divider::before,.or-divider::after{
    content:'';flex:1;height:1px;background:var(--border);
  }

  /* Submit button */
  .btn-sv-primary {
    width:100%;padding:15px;border-radius:10px;
    background:var(--red);color:#fff;
    border:none;font-family:'Outfit',sans-serif;
    font-size:1rem;font-weight:700;cursor:pointer;
    letter-spacing:.5px;transition:all .25s;
    position:relative;overflow:hidden;
    margin-top:8px;
  }
  .btn-sv-primary::before {
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);
  }
  .btn-sv-primary:hover{background:var(--red-dark);transform:translateY(-1px);box-shadow:0 8px 25px rgba(229,9,20,0.4);}
  .btn-sv-primary:active{transform:translateY(0);}
  .btn-sv-primary .spinner {
    display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .6s linear infinite;margin-right:8px;
  }
  .btn-sv-primary.loading .spinner{display:inline-block;}
  .btn-sv-primary.loading .btn-text{opacity:0.7;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Terms */
  .terms-check {
    display:flex;align-items:flex-start;gap:10px;
    font-size:.82rem;color:var(--muted);margin-top:16px;
  }
  .terms-check input[type=checkbox]{
    width:16px;height:16px;margin-top:2px;
    accent-color:var(--red);cursor:pointer;flex-shrink:0;
  }
  .terms-check a{color:var(--red);text-decoration:none;}
  .terms-check a:hover{text-decoration:underline;}
  /* Login link */
  .login-link {
    text-align:center;margin-top:24px;
    font-size:.9rem;color:var(--muted);
  }
  .login-link a{color:var(--text);font-weight:600;text-decoration:none;}
  .login-link a:hover{color:var(--red);}
  /* Toast */
  .toast-sv {
    position:fixed;top:24px;right:24px;z-index:9999;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:12px;padding:16px 20px;min-width:300px;
    display:flex;align-items:center;gap:12px;
    transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .toast-sv.show{transform:translateX(0);}
  .toast-icon{font-size:1.3rem;}
  .toast-msg{font-size:.9rem;}
  /* Steps indicator */
  .steps {
    display:flex;align-items:center;
    gap:0;margin-bottom:28px;
  }
  .step {
    display:flex;align-items:center;gap:8px;
    font-size:.78rem;font-weight:600;
    color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
  }
  .step.active{color:var(--text);}
  .step.done{color:var(--red);}
  .step-num {
    width:24px;height:24px;border-radius:50%;
    border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;flex-shrink:0;
  }
  .step-line{flex:1;height:1px;background:var(--border);margin:0 8px;}
  @media(max-width:576px){
    .top-bar{padding:16px 20px;}
    .signup-card{padding:32px 24px;}
    .plan-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="bg-cinematic"></div>

<!-- Top bar -->
<div class="top-bar">
  <a href="home.html" class="logo">Movie<span>Blast</span></a>
  <a href="signin.html" style="color:var(--muted);text-decoration:none;font-size:.9rem;">
    Already a member? <strong style="color:var(--text);">Sign In</strong>
  </a>
</div>

<!-- Signup Card -->
<div class="signup-wrap">
  <div class="signup-card">
    

    <h1>Create Account</h1>
    <p class="subtitle">Start streaming 50+ movies &amp; shows today</p>

   

    <!-- Form -->
    <form id="signupForm" novalidate>
      <!-- Name row -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" id="firstName" class="form-control-sv" placeholder="John"/>
          <div class="error-msg" id="firstNameErr">Required</div>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" id="lastName" class="form-control-sv" placeholder="Doe"/>
          <div class="error-msg" id="lastNameErr">Required</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon">
          <input type="email" id="email" class="form-control-sv" placeholder="john@example.com"/>
          <i class="fas fa-envelope" id="emailIcon"></i>
        </div>
        <div class="error-msg" id="emailErr">Enter a valid email</div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon">
          <input type="password" id="password" class="form-control-sv" placeholder="Min. 8 characters" oninput="checkStrength(this.value)"/>
          <i class="fas fa-eye" id="togglePass" onclick="togglePassword('password','togglePass')"></i>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="error-msg" id="passErr">Password must be 8+ characters</div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-icon">
          <input type="password" id="confirmPass" class="form-control-sv" placeholder="Repeat password"/>
          <i class="fas fa-eye" id="togglePass2" onclick="togglePassword('confirmPass','togglePass2')"></i>
        </div>
        <div class="error-msg" id="confirmErr">Passwords do not match</div>
      </div>

     
      <!-- Terms -->
      <div class="terms-check">
        <input type="checkbox" id="terms"/>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of StreamVerse</label>
      </div>
      <div class="error-msg" id="termsErr">You must accept the terms</div>

     <a href="signin.html">
  <button type="button" class="btn-sv-primary" id="submitBtn">
    <span class="spinner"></span>
    <span class="btn-text">Create My Account</span>
  </button>
</a>

      
    </form>

    <div class="login-link">Already have an account? <a href="signin.html">Sign In</a></div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast-sv" id="toast">
  <span class="toast-icon" id="toastIcon"></span>
  <span class="toast-msg" id="toastMsg"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
